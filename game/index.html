<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Ridgeline Run: fly a bush plane down a mountain valley, thread the rings and land on the far strip.">
<title>Ridgeline Run — a valley flight game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1626; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Ridgeline Run: fly the valley, thread the rings, and land on the far strip"></canvas>
<noscript><p style="color:#fff;font-family:sans-serif;padding:2em">Ridgeline Run needs JavaScript to fly.</p></noscript>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
